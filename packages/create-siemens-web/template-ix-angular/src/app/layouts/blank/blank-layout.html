<ix-application>
  <ix-application-header name="Siemens Industrial Experience App">
    @if (showLogo) {
      <app-company-logo slot="logo" />
    }
    <ix-avatar initials="JD" aria-label="User avatar: JD" />
  </ix-application-header>
  <ix-menu enableToggleTheme aria-label="Main navigation">
    <a
      routerLink=""
      routerLinkActive
      #homeLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      tabindex="-1"
    >
      <ix-menu-item [icon]="iconHome" [active]="homeLink.isActive" aria-label="Home"
        >Home</ix-menu-item
      >
    </a>
  </ix-menu>
  <ix-content>
    <router-outlet />
  </ix-content>
</ix-application>
