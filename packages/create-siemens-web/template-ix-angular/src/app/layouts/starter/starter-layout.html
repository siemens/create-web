<ix-application>
  <ix-application-header name="Siemens Industrial Experience Starter App">
    @if (showLogo) {
      <app-company-logo slot="logo" />
    }
    <ix-avatar initials="JD" aria-label="User avatar: JD" />
  </ix-application-header>
  <ix-menu enableToggleTheme aria-label="Main navigation">
    <a
      routerLink=""
      routerLinkActive
      #homeLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      tabindex="-1"
    >
      <ix-menu-item [icon]="icons.iconHome" [active]="homeLink.isActive" aria-label="Get Started"
        >Get Started</ix-menu-item
      >
    </a>
    <a
      routerLink="forms"
      routerLinkActive
      #formsLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      tabindex="-1"
    >
      <ix-menu-item [icon]="icons.iconTextDocument" [active]="formsLink.isActive" aria-label="Forms"
        >Forms</ix-menu-item
      >
    </a>
    <a
      routerLink="charts"
      routerLinkActive
      #chartsLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      tabindex="-1"
    >
      <ix-menu-item [icon]="icons.iconPiechart" [active]="chartsLink.isActive" aria-label="Charts"
        >Charts</ix-menu-item
      >
    </a>
    <a
      routerLink="grids"
      routerLinkActive
      #gridsLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      tabindex="-1"
    >
      <ix-menu-item [icon]="icons.iconTable" [active]="gridsLink.isActive" aria-label="Grids"
        >Grids</ix-menu-item
      >
    </a>
  </ix-menu>
  <ix-content>
    <router-outlet />
  </ix-content>
</ix-application>
