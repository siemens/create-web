name: Release Please

on:
  workflow_dispatch:
  push:
    branches: ['main']

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/create-siemens-web--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/create-siemens-web--tag_name'] }}
    steps:
      - name: Create release pull request or release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    if: ${{ needs.release.outputs.release_created == 'true' }}
    needs: release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Install Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@krypton
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish create-siemens-web
        working-directory: packages/create-siemens-web
        run: pnpm publish --access public --no-git-checks
        env:
          PNPM_CONFIG__AUTH: >-
            { "https://registry.npmjs.org": { "@": { "authToken": ${{ toJSON(secrets.NPM_TOKEN) }} } } }
