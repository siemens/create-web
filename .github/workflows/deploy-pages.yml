name: Deploy GitHub Page

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Please confirm deployment'
        required: true
        type: boolean

concurrency: deploy-gh-pages-${{ github.ref }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-starter-templates:
    uses: ./.github/workflows/build-templates.yml
    with:
      themes: '[true]'
      upload-artifacts: true
    secrets:
      SIEMENS_NPM_TOKEN: ${{ secrets.SIEMENS_NPM_TOKEN }}

  deploy-starter-templates:
    #    if: ${{ inputs.confirm_deployment == true && github.repository == 'siemens/create-web' }}
    needs: build-starter-templates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download starter sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-*-siemens
          merge-multiple: true
          path: github-pages

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: github-pages

      - name: Deploy starter templates
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
