name: CI

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # We need this for commit-lint
      - name: Install Node.js and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lithium
          cache: true
          install: false
      - run: pnpm run lint:format
      - run: pnpm run lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Scaffold React Starter
        run: >-
          pnpm exec packages/create-siemens-web/index.js github-pages-source/react-starter
          --no-interactive --template ix-react-starter

      - name: Install React Starter dependencies
        working-directory: github-pages-source/react-starter
        run: pnpm install --ignore-workspace

      - name: Install Chromium for scaffolded template tests
        working-directory: github-pages-source/react-starter
        run: pnpm exec playwright install --with-deps chromium

      - name: Test React Starter
        working-directory: github-pages-source/react-starter
        run: pnpm --ignore-workspace test

      - name: Build React Starter
        working-directory: github-pages-source/react-starter
        run: pnpm --ignore-workspace build --base=/react-starter/

      - name: Scaffold Vue Starter
        run: >-
          pnpm exec packages/create-siemens-web/index.js github-pages-source/vue-starter
          --no-interactive --template ix-vue-starter

      - name: Install Vue Starter dependencies
        working-directory: github-pages-source/vue-starter
        run: pnpm install --ignore-workspace

      - name: Install Vue Starter Chromium
        working-directory: github-pages-source/vue-starter
        run: pnpm exec playwright install chromium

      - name: Test Vue Starter
        working-directory: github-pages-source/vue-starter
        run: pnpm --ignore-workspace test

      - name: Build Vue Starter
        working-directory: github-pages-source/vue-starter
        run: pnpm --ignore-workspace build --base=/vue-starter/

      - name: Scaffold Angular Starter
        run: >-
          pnpm exec packages/create-siemens-web/index.js github-pages-source/angular-starter
          --no-interactive --template ix-angular-starter

      - name: Install Angular Starter dependencies
        working-directory: github-pages-source/angular-starter
        run: pnpm install

      - name: Install Angular Starter Chromium
        working-directory: github-pages-source/angular-starter
        run: pnpm exec playwright install chromium

      - name: Test Angular Starter
        working-directory: github-pages-source/angular-starter
        run: pnpm test

      - name: Build Angular Starter
        working-directory: github-pages-source/angular-starter
        run: pnpm run build --base-href=/angular-starter/

      - name: Scaffold Element Starter
        run: >-
          pnpm exec packages/create-siemens-web/index.js github-pages-source/element-starter
          --no-interactive --template element-starter

      - name: Install Element Starter dependencies
        working-directory: github-pages-source/element-starter
        run: pnpm install
        env:
          # GitLab serves tarballs through the project-scoped registry route.
          PNPM_CONFIG__AUTH: >-
            { "https://code.siemens.com/api/v4/projects/732/packages/npm": { "@simpl": { "authToken": "${{ secrets.SIEMENS_NPM_TOKEN }}" } } }

      - name: Lint Element Starter format
        working-directory: github-pages-source/element-starter
        run: pnpm run lint:format

      - name: Lint Element Starter Sass
        working-directory: github-pages-source/element-starter
        run: pnpm run lint:sass

      - name: Install Element Starter Chromium
        working-directory: github-pages-source/element-starter
        run: pnpm exec playwright install chromium

      - name: Test Element Starter
        working-directory: github-pages-source/element-starter
        run: pnpm run test

      - name: Build Element Starter
        working-directory: github-pages-source/element-starter
        run: pnpm run build
