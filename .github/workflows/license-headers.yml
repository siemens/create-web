name: License Headers

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: license-headers-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: Check License Headers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check License Headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: .licenserc.yaml
          mode: check
          token: ''

  fix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Fix License Headers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Fix License Headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: .licenserc.yaml
          mode: fix
          token: ''

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: fix/license-headers
          commit-message: 'fix: add missing license headers'
          title: 'fix: add missing license headers'
          body: |
            Apply missing license headers using Apache SkyWalking Eyes and
            the repository's `.licenserc.yaml` configuration.
          delete-branch: true
